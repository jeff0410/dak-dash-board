<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RTMC Agents · 로그인</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#1b1528;--card:#2a2140;--line:#4d3f78;--text:#f6f0ff;--sub:#bcaee0;--dim:#8676ad;--pink:#ff7edb;--hot:#ff2e97;--cyan:#36f9f6;--yellow:#fede5d;--red:#fe4450}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse 70% 50% at 50% 100%,rgba(255,46,151,.22),transparent 70%),linear-gradient(180deg,#1b1528,#28173a);color:var(--text);font:15px/1.5 Pretendard,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden;padding:16px}
.grid{position:fixed;left:-60%;right:-60%;bottom:0;height:45%;pointer-events:none;background-image:linear-gradient(rgba(255,126,219,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(255,126,219,.3) 1px,transparent 1px);background-size:64px 44px;transform:perspective(260px) rotateX(62deg);transform-origin:bottom;-webkit-mask:linear-gradient(to top,#000 10%,transparent 95%);animation:gm 3.5s linear infinite}
@keyframes gm{to{background-position:0 44px}}
form{position:relative;width:100%;max-width:380px;background:rgba(42,33,64,.92);border:1px solid var(--line);border-radius:18px;padding:34px 30px 28px;box-shadow:0 0 40px rgba(255,46,151,.25);backdrop-filter:blur(6px)}
.logo{font-family:Audiowide,sans-serif;font-size:26px;letter-spacing:1px;text-align:center;background:linear-gradient(90deg,var(--yellow),var(--pink) 45%,var(--cyan));-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,46,151,.6))}
.sub{text-align:center;color:var(--dim);font-size:13px;margin:6px 0 26px}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:#15101f;color:var(--text);padding:0 14px;font:inherit;outline:none;transition:.15s}
input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,151,.18)}
button{width:100%;height:48px;margin-top:24px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--hot),#c73cff);color:#fff;font:700 15px Pretendard,sans-serif;cursor:pointer;box-shadow:0 0 18px rgba(255,46,151,.45)}
button:hover{filter:brightness(1.1)}
.err{display:none;margin-top:16px;padding:10px 12px;border-radius:9px;background:rgba(254,68,80,.12);border:1px solid rgba(254,68,80,.4);color:#ff9aa2;font-size:13px}
.err.show{display:block}
</style>
</head>
<body>
<div class="grid"></div>
<form method="post" action="/login">
  <div class="logo">RTMC AGENTS</div>
  <div class="sub">에이전트 대시보드 · 로그인이 필요해요</div>
  <label for="user">아이디</label>
  <input id="user" name="user" autocomplete="username" required autofocus>
  <label for="password">비밀번호</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">로그인</button>
  <div class="err" id="err"></div>
</form>
<script>
const e = new URLSearchParams(location.search).get('e'), el = document.getElementById('err');
if (e) { el.textContent = e === 'locked' ? '실패가 너무 많아요. 15분 뒤에 다시 시도해 주세요.' : '아이디 또는 비밀번호가 맞지 않아요.'; el.classList.add('show'); }
</script>
</body>
</html>
